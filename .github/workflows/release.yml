name: Release
# Manual release: enter a version, it validates and tests, then tags and creates a GitHub release.
# Nothing is uploaded anywhere: Packagist reads the new tag through the GitHub hook.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (e.g. 1.1.0)'
        required: true
        type: string
permissions:
  contents: write # push the tag, create the release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The lowest version composer.json allows, so a release cannot ship code that needs a newer one.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer run test

      - name: Tag and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "Not a semver version: '$VERSION'. Enter it without a leading v."; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "release: v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --generate-notes
